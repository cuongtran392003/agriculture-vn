services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriculturevn-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongodb:27017/agricultureVN}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or .env file}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - agriculturevn-network

  mongodb:
    image: mongo:7
    container_name: agriculturevn-mongodb
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    environment:
      MONGO_INITDB_DATABASE: agricultureVN
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agriculturevn-network

volumes:
  mongodb_data:
    driver: local

networks:
  agriculturevn-network:
    driver: bridge
